name: Alpha Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpha:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Compute alpha tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "0.2.3"
          $existing = (gh release list --limit 100 --json tagName | ConvertFrom-Json).tagName
          $next = 3
          foreach ($tagName in $existing) {
            if ($tagName -match "^v$version-alpha\.(\d+)$") {
              $next = [Math]::Max($next, [int]$Matches[1] + 1)
            }
          }
          $tag = "v$version-alpha.$next"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Test
        run: cargo test --workspace
      - name: Package x64 debug
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture x64 -Configuration debug -ReleaseTag $env:RELEASE_TAG
      - name: Package x64 release
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture x64 -Configuration release -ReleaseTag $env:RELEASE_TAG
      - name: Package arm64 debug
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture arm64 -Configuration debug -ReleaseTag $env:RELEASE_TAG
      - name: Package arm64 release
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture arm64 -Configuration release -ReleaseTag $env:RELEASE_TAG
      - name: Create GitHub alpha pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LSENext ${{ env.RELEASE_TAG }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*.msi
            artifacts/*.zip
