name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace
      - name: Package x64 debug
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture x64 -Configuration debug -ReleaseTag ${{ github.ref_name }}
      - name: Package x64 release
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture x64 -Configuration release -ReleaseTag ${{ github.ref_name }}
      - name: Package arm64 debug
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture arm64 -Configuration debug -ReleaseTag ${{ github.ref_name }}
      - name: Package arm64 release
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture arm64 -Configuration release -ReleaseTag ${{ github.ref_name }}
      - name: Delete pre-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --json tagName,isPrerelease | ConvertFrom-Json
          foreach ($r in $releases | Where-Object { $_.isPrerelease }) {
            Write-Host "Deleting pre-release: $($r.tagName)"
            gh release delete $r.tagName --yes
          }
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LSENext ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.msi
            artifacts/*.zip
