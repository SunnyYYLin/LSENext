name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Test
        run: cargo test --workspace
      - name: Build x64
        run: cargo build --workspace --release --target x86_64-pc-windows-msvc
      - name: Build arm64
        run: cargo build --workspace --release --target aarch64-pc-windows-msvc
      - name: Package x64
        shell: pwsh
        run: |
          dotnet tool restore
          ./scripts/package.ps1 -Architecture x64
      - name: Package arm64
        shell: pwsh
        run: ./scripts/package.ps1 -Architecture arm64
      - uses: actions/upload-artifact@v4
        with:
          name: lsenext-artifacts
          path: |
            artifacts/*.msi
            artifacts/*.zip
